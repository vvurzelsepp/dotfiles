# ==================================================
# LANGUAGE GRAMMAR
# ==================================================
 
"namespace" = { fg = "type" }
"module" = { fg = "type" }

"type" = { fg = "type" }
"type.builtin" = { fg = "type" }
"type.enum.variant" = { fg = "type2" }
"constructor" = { fg = "type" }

"keyword" = { fg = "blue2", bg = "light_gray2" }
"keyword.directive" = { fg = "blue2" }
"keyword.control.return" = { bg = "red", fg = "white" }
"keyword.control.exception" = { bg = "red", fg = "white" }
"keyword.control.conditional" = { bg = "gold", fg = "dark_gray2" }
"keyword.control.import" = { fg = "gold2" }
"keyword.control" = { bg = "dark_green2", fg = "white" }
"label" = { fg = "blue2" }
"tag" = "blue2"

"special" = { fg = "text" }
"operator" = { fg = "text" }

"punctuation" = { fg = "text" }
"punctuation.delimiter" = { fg = "text" }

# member variables
"variable" = { fg = "dark-gray" }
"variable.parameter" = { fg = "text", modifiers = ["italic"] }
"variable.other.member" = { fg = "variable" }
"variable.builtin" = { fg = "blue2" }
# variantes / constants
"constant" = { fg = "constant_color" }
"constant.builtin" = { fg = "blue2" }


"function" = { fg = "fn_declaration", modifiers = ["italic"] }
"function.builtin" = { fg = "fn_declaration" }
"function.macro" = { fg = "blue2" }
"attribute" = { fg = "fn_declaration" }

"comment" = { fg = "dark_gray" }

"string" = { fg = "dark_green" }
"constant.character" = { fg = "orange" }
"string.regexp" = { fg = "gold" }
"constant.numeric" = { fg = "red" }
"constant.character.escape" = { fg = "gold" }

"markup.heading" = { fg = "blue2", modifiers = ["bold"] }
"markup.list" = "blue3"
"markup.bold" = { fg = "blue2", modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { modifiers = ["underlined"] }
"markup.link.text" = "orange"
"markup.quote" = "dark_green"
"markup.raw" = "orange"

"diff.plus" = { fg = "dark_green2" }
"diff.delta" = { fg = "blue4" }
"diff.minus" = { fg = "orange_red" }

# ==================================================
# UI
# ==================================================
"ui.background" = { fg = "light_gray", bg = "white" }

"ui.window" = { bg = "widget" }
"ui.popup" = { fg = "text", bg = "widget" }
"ui.help" = { fg = "text", bg = "widget" }
"ui.menu" = { fg = "text", bg = "widget" }
"ui.menu.selected" = { bg = "dark_gray", fg = "text" }

# TODO: Alternate bg colour for `ui.cursor.match` and `ui.selection`.
"ui.cursor" = { fg = "cursor", modifiers = ["reversed"] }
"ui.cursor.primary" = { fg = "cursor", modifiers = ["reversed"] }
"ui.cursor.match" = { bg = "cursor", modifiers = ["underlined"] }

"ui.selection" = { bg = "#ADD6FF" } # "#3a3d41" }
"ui.selection.primary" = { bg = "#ADD6FF" }

"ui.linenr" = { fg = "dark_gray" }
"ui.linenr.selected" = { fg = "light_gray2" }

"ui.cursorline.primary" = { bg = "light_gray3" }
"ui.statusline" = { fg = "white", bg = "blue" }
"ui.statusline.inactive" = { fg = "white", bg = "blue" }
"ui.statusline.insert" = { fg = "white", bg = "yellow" }
"ui.statusline.select" = { fg = "white", bg = "magenta" }

"ui.bufferline" = { fg = "text", bg = "widget" }
"ui.bufferline.active" = { fg = "white", bg = "blue" }
"ui.bufferline.background" = { bg = "background" }

"ui.text" = { fg = "text" }
"ui.text.focus" = { fg = "red" }

"ui.virtual.whitespace" = { fg = "dark_gray" }
"ui.virtual.ruler" = { bg = "borders" }
"ui.virtual.indent-guide" = { fg = "light_gray3" }
"ui.virtual.inlay-hint" = { fg = "dark_gray5"}

# ================================================
# DIAGNOSTICS
# ================================================
"warning" = { fg = "gold2" }
"error" = { fg = "red" }
"info" = { fg = "light_blue" }
"hint" = { fg = "light_gray3" }

"diagnostic.error" = { modifiers = ["crossed_out"], fg = "red" }
"diagnostic".underline = { color = "gold", style = "curl" }
"diagnostic.warn" = { modifiers = ["crossed_out"] }

