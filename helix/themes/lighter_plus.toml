pale_green = "#b5cea8"
dark_green = "#008000"
dark_green2 = "#487e02"
light_gray = "#d4d4d4"
light_gray2 = "#e0e0e0"
light_gray3 = "#bfbfbf"
dark_gray = "#858585"
dark_gray2 = "#1e1e1e"
dark_gray3 = "#282828"
dark_gray4 = "#404040"
dark_gray5 = "#8b949e"
blue = "#007acc"
blue2 = "#4175A1"
blue2_dimmed = "#062742"
blue3 = "#6796E6"
blue4 = "#1b81a8"
light_blue = "#75beff"
dark_blue = "#264f78"
dark_blue2 = "#094771"
# red = "#bb434f"
red = "#c24c58"
# red = "#BF616A"
