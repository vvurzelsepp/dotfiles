orange_red = "#f14c4c"

# language built-in types like u8, struct names, etc
type = "#3A9684"
type2 = "#2E7869"
special = "#C586C0"
fn_declaration = "#998459" #"#A1A17C"
constant_color = "#007acc"
background = "#1e1e1e"
text = "#404040"
cursor = "#7d7d7d"
widget = "#d5d5d5"
borders = "#323232"

